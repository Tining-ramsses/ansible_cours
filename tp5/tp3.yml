- name: Installer apache2 et mysql-server sur node1
  ansible.builtin.apt:
    name: "{{ item }}"
    state: present
    update_cache: true
  loop:
    - apache2
    - mysql-server
  when: ansible_facts['hostname'] == 'node1'

- name: Installer apache2 et mysql-server sur node2
  ansible.builtin.apt:
    name: "{{ item }}"
    state: present
    update_cache: true
  loop:
    - apache2
    - mysql-server
  when: ansible_facts['hostname'] == 'node2'

- name: Installer git, nginx et cowsay sur node3
  ansible.builtin.apt:
    name: "{{ item }}"
    state: present
    update_cache: true
  loop:
    - git
    - nginx
    - cowsay
  when: ansible_facts['hostname'] == 'node3'

- name: Installer ufw sur les machines Ubuntu
  ansible.builtin.apt:
    name: ufw
    state: present
  when: ansible_facts['distribution'] == 'Ubuntu'

- name: Gather the package_facts
  ansible.builtin.package_facts:
    manager: auto

- name: Déployer le fichier HTML pour Apache
  ansible.builtin.template:
    src: template/index.j2
    dest: /var/www/html/index.html
    mode: "0644"
  when: "'apache2' in ansible_facts.packages"

- name: Déployer le fichier HTML pour Nginx
  ansible.builtin.template:
    src: templates/index.j2
    dest: /usr/share/nginx/html/index.html
    mode: "0644"
  when: "'nginx' in ansible_facts.packages"

- name: Démarrer le service Apache
  ansible.builtin.service:
    name: apache2
    state: started
    enabled: true
  when: "'apache2' in ansible_facts.packages"

- name: Démarrer le service Nginx
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true
  when: "'nginx' in ansible_facts.packages"

- name: Créer le fichier /etc/jour avec la date et heure
  ansible.builtin.template:
    src: template/day.j2
    dest: /etc/jour
    mode: "0644"
